# Full YanetConfig v2alpha1 example (final model).
# Demonstrates all three layers:
#   1. spec.components — workload palette (fixed workloads, dataplane sidecars, dynamic operators[])
#   2. spec.patches    — named registry of strategic-merge Deployment patch fragments
#   3. spec.boxTypes   — box presets: which components are enabled and which patches to apply
#
# See also: yanet-operator/YANET2_MIGRATION_PLAN/17-final-model.md
---
apiVersion: yanet.yanet-platform.io/v2alpha1
kind: YanetConfigV2
metadata:
  name: config
spec:
  # ============================================================
  # Global kill switch + node-restart throttling (same as v1).
  # ============================================================
  stop: false           # true → reconcile loop does nothing (cluster-wide kill switch)
  updateWindow: 60      # seconds: GLOBAL throttling between node restarts across the WHOLE cluster
                        # (protects against mass simultaneous restarts of network boxes)
  # Inclusive target-port pool used only when a final patched workload combines
  # hostNetwork=true with a Service-backed listener.
  hostNetworkPortRange: {start: 20000, end: 20100}

  # Global image settings.
  images:
    registry: cr.yandex/yanet
    # pullPolicy defaults to IfNotPresent when omitted.
    # Set to Always for :latest tags or during active development.
    pullPolicy: IfNotPresent
    pullSecrets:
      - name: cr-secret

  # ============================================================
  # 1) COMPONENTS — component palette
  # ============================================================
  components:
    # --- Fixed workloads ---
    controlplane:
      image: {name: controlplane, tag: v2.1.0}
      config:
        # hostPath is the HOST directory mounted into the container at /etc/yanet2.
        # Args are passed to the binary verbatim, except for the config path:
        # the operator appends the NUMA index to its base name, so each per-NUMA
        # instance reads its own file — /etc/yanet2/controlplane-0.yaml on NUMA 0,
        # controlplane-1.yaml on NUMA 1, ... Those files must exist on the host
        # and carry matching gateway.instance_id / endpoints.
        hostPath: /etc/yanet2
        args: [-c, /etc/yanet2/controlplane.yaml]
      numa: 1               # default; for multi-NUMA — 2/4
      # NUMA domains that must NOT get a controlplane instance, e.g. a domain
      # with no NIC, where the dataplane runs no instance to attach to.
      # Per-installation override: YanetV2.spec.components.controlplane.disabledNuma.
      # disabledNuma: [1]

    dataplane:
      image: {name: dataplane, tag: v2.1.0}
      hugepages:
        size: 1Gi
        count: 8
      hostNetwork: false    # default; set true only for legacy deployments
      config:
        hostPath: /etc/yanet2
        args: [/etc/yanet2/dataplane.yaml]

      # Fixed optional native sidecars share the dataplane Pod network namespace.
      # They are rendered as restartable init containers (restartPolicy: Always).
      sidecars:
        bird:
          image: {name: bird, tag: "2.15"}
          config:
            # Mounted at /etc/bird. BIRD reads bird.conf or bird6.conf.
            hostPath: /etc/bird
        netlinkDataplaneSidecar:
          image: {name: netlink-dataplane-sidecar, tag: v2.1.0}
          config:
            hostPath: /etc/yanet2
            args: [-c, /etc/yanet2/netlink-dataplane-sidecar.yaml]

    # NOTE: birdAdapter is a separate Deployment (not a native sidecar),
    # so the adapter can be updated without restarting bird.
    # bird ↔ birdAdapter communicate via a shared hostPath (e.g. /run/bird/bird.sock).
    # Process: /usr/bin/yanet-bird-adapter server -c /etc/yanet2/bird-adapter.yaml
    birdAdapter:
      image: {name: bird-adapter, tag: v0.3}
      config:
        # Inline config rendered to a ConfigMap and mounted at /etc/yanet2/bird-adapter.yaml.
        # gateway_endpoint targets the shared route Service for the balancer box type.
        inline: |
          # YANET BIRD Adapter Configuration

          # Logging configuration
          logging:
            # Log level: debug, info, warn, error
            level: debug

          # gRPC endpoint to listen on for adapter service (all interfaces)
          listen_addr: "0.0.0.0:8080"

          # gRPC endpoint of the RouteService gateway for RIB updates
          gateway_endpoint: "yanet-balancer-route:8080"

    announcer:
      image: {name: announcer, tag: v0.2}
      config:
        hostPath: /etc/yanet2
        args: [-c, /etc/yanet2/yanet-announcer.yaml]

    # --- Dynamic operators (array, no hardcoded names) ---
    operators:
      - name: antiddos
        containers:
          - name: operator
            image: {name: antiddos-operator, tag: v0.5}
          - name: agent
            image: {name: antiddos-agent, tag: v0.5}
            hostIPC: true
      - name: route
        containers:
          - name: route
            image: {name: route-operator, tag: v0.4}

  # ============================================================
  # 2) PATCHES — named registry of strategic merge patches.
  #    Each patch is a fragment of appsv1.Deployment (RawExtension).
  # ============================================================
  patches:
    # Managed listener variables are inserted before patch variables. Their
    # values are 8080/8081 in a Pod netns or allocated from
    # hostNetworkPortRange for a host-network Pod.
    - name: controlplane-listener
      patch:
        spec:
          template:
            spec:
              containers:
                - name: controlplane
                  env:
                    - name: YANET_GATEWAY_ENDPOINT
                      value: '[::]:$(YANET_KUBERNETES_GRPC_PORT)'

    - name: route-listener
      patch:
        spec:
          template:
            spec:
              containers:
                - name: route
                  env:
                    - name: YANET_SERVER_ENDPOINT
                      value: '[::]:$(YANET_KUBERNETES_GRPC_PORT)'

    # --- Universal (applied almost everywhere) ---
    - name: tolerations
      patch:
        spec:
          template:
            spec:
              tolerations:
                - effect: NoSchedule
                  key: CriticalAddonsOnly
                - effect: NoSchedule
                  operator: Exists
                - effect: NoExecute
                  operator: Exists

    - name: telegraf
      patch:
        spec:
          template:
            metadata:
              annotations:
                telegraf.influxdata.com/ports: "8080"

    - name: checkpointer
      patch:
        spec:
          template:
            metadata:
              annotations:
                checkpointer.ydb.tech/checkpoint: "true"
                checkpointer.ydb.tech/manual-recovery: "true"

    # --- controlplane ---
    # NOTE: hostIPC and the /dev/hugepages shmem mount the controlplane uses
    # to reach the dataplane arena are emitted by the builder itself (see
    # internal/manifests/builder_v2.go, applyControlplaneShmem). Patches only
    # add the reload postStart hook here.
    - name: cp-reloader-poststart
      patch:
        spec:
          template:
            spec:
              containers:
                - name: controlplane
                  lifecycle:
                    postStart:
                      exec:
                        command:
                          - /bin/sh
                          - -c
                          - |
                            sleep 60
                            mountpoint -q /etc/yanet/controlplane.conf
                            mount -o ro,bind /etc/yanet/controlplane.slb.conf /etc/yanet/controlplane.conf
                            yanet-cli reload 2>&1 >> /reloader.log

    - name: cp-resources-release
      patch:
        spec:
          template:
            spec:
              containers:
                - name: controlplane
                  resources:
                    requests: {cpu: "1",  memory: 16Gi}
                    limits:   {cpu: "6",  memory: 128Gi}

    - name: cp-resources-balancer
      patch:
        spec:
          template:
            spec:
              containers:
                - name: controlplane
                  resources:
                    requests: {cpu: "1",  memory: 32Gi}
                    limits:   {cpu: "6",  memory: 128Gi}

    # --- dataplane ---
    # NOTE: the dataplane's security baseline is emitted by the BUILDER, not
    # by a patch — see internal/manifests/builder_v2.go (applyDataplaneSecurity).
    # The builder always sets, for the dataplane:
    #   - privileged: true  (MANDATORY — opening /dev/vfio/vfio and
    #     /dev/vhost-net is blocked by the device cgroup for non-privileged
    #     containers, even root with CAP_SYS_ADMIN/CAP_SYS_RAWIO; the only
    #     alternative is an SR-IOV device plugin, out of scope)
    #   - hostNetwork: false by default, hostIPC: true
    #   - minimal host devices: /dev/vfio, /dev/vhost-net, /dev/net
    #   - /sys read-only, config read-only, hugepages
    # Do NOT re-add those here. Patches only tune resources.
    - name: dp-resources
      patch:
        spec:
          template:
            spec:
              containers:
                - name: dataplane
                  resources:
                    limits: {memory: 32Gi}

    - name: firewall-max-memory
      # Pinpoint override for boxType=firewall.
      patch:
        spec:
          template:
            spec:
              containers:
                - name: dataplane
                  resources:
                    limits: {memory: 64Gi}

    # --- BIRD native sidecar / announcer ---
    - name: bird-resources
      patch:
        spec:
          template:
            spec:
              initContainers:
                - name: bird
                  resources:
                    requests: {cpu: 100m, memory: 4Gi}
                    limits:   {cpu: "6", memory: 64Gi}

    - name: announcer-resources
      patch:
        spec:
          template:
            spec:
              containers:
                - name: announcer
                  resources:
                    requests: {cpu: 100m, memory: 4Gi}
                    limits:   {cpu: "4", memory: 32Gi}

    # --- generic netconfig initContainer example ---
    - name: netconfig-init
      patch:
        spec:
          template:
            spec:
              initContainers:
                - name: netconfig
                  image: ubuntu:22.04
                  command:
                    - /bin/sh
                    - -c
                    - |
                      apt-get install -y jq iproute2
                      until ip addr | grep kni[0-9]; do sleep 2; done
                      # ... read controlplane.conf and configure interfaces

  # ============================================================
  # 3) BOX TYPES — box presets.
  #    Per enabled component — list of patch names.
  #    Patches are applied in declared order.
  #    If a section is absent — the component is DISABLED for this boxType.
  # ============================================================
  boxTypes:
    # ---- release: cp + dp with native sidecars + announcer (standard)
    - name: release
      components:
        controlplane:
          patches: [controlplane-listener, tolerations, telegraf, checkpointer, cp-reloader-poststart, cp-resources-release]
        dataplane:
          sidecars:
            bird: {}
            netlinkDataplaneSidecar: {}
          patches: [tolerations, telegraf, checkpointer, dp-resources, bird-resources]
        announcer:
          patches: [tolerations, telegraf, checkpointer, announcer-resources]
      # operators: {}   # not enabled

    # ---- balancer: cp + dp with native sidecars + birdAdapter (no announcer)
    - name: balancer
      components:
        controlplane:
          patches: [controlplane-listener, tolerations, telegraf, checkpointer, cp-reloader-poststart, cp-resources-balancer]
        dataplane:
          sidecars:
            bird: {}
            netlinkDataplaneSidecar: {}
          patches: [tolerations, telegraf, checkpointer, dp-resources, bird-resources]
        birdAdapter:
          patches: [tolerations, telegraf, checkpointer]
      operators:
        route:
          patches: [route-listener, tolerations, telegraf]

    # ---- firewall: cp + dp (max memory) with native sidecars + antiddos
    - name: firewall
      components:
        controlplane:
          patches: [controlplane-listener, tolerations, telegraf, checkpointer, cp-reloader-poststart, cp-resources-balancer]
        dataplane:
          sidecars:
            bird: {}
            netlinkDataplaneSidecar: {}
          patches: [tolerations, telegraf, checkpointer, dp-resources, firewall-max-memory, bird-resources]
      operators:
        antiddos:
          patches: [tolerations, telegraf]
