replicaCount: 2

# Enable after cert-manager CRDs are installed, using the optional dependency or
# an existing installation. The issuer and constrained approver remain external.
# This grants Certificate permissions only; the manager never reads TLS Secrets.
manageCertificates: false

# Cluster-wide dependency: enable only when this release owns cert-manager.
# Leave disabled when cert-manager is already managed by another release.
cert-manager:
  enabled: false
  crds:
    enabled: true
    keep: true

image:
  repository: ghcr-io.mirror.yandex.net/yanet-platform/yanet-operator
  pullPolicy: IfNotPresent
  # tag: ""  # If not set, defaults to .Chart.AppVersion from Chart.yaml

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "yanet-operator"

serviceAccount:
  create: true
  name: "controller-manager"

podAnnotations: {}

hostNetwork: false

podSecurityContext: {}

securityContext: {}

resources:
  limits:
    cpu: 4
    memory: 4Gi
  requests:
     cpu: 2
     memory: 2Gi

tolerations: []
nodeSelector: {}

affinity: {}

# Webhook configuration
webhook:
  enabled: true
  port: 9443
  # failurePolicy controls what happens when the webhook endpoint is unreachable.
  # "Ignore" — allow the request through when the webhook is unavailable. This is
  #             required to avoid x509 errors during the window between Helm's main
  #             resource phase (which resets caBundle to empty) and the post-install/
  #             post-upgrade job that patches caBundle back in. Also allows installs
  #             when the operator pod is not yet Ready.
  # "Fail"   — reject the request if the webhook is unreachable (stricter, but
  #             requires caBundle to always be populated and operator to be running).
  failurePolicy: Ignore
  certManager:
    enabled: false
  # Certificate generation using kube-webhook-certgen
  certGen:
    image:
      repository: registry.k8s.io/ingress-nginx/kube-webhook-certgen
      tag: v1.6.9
      pullPolicy: IfNotPresent

# Metrics configuration
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    release: kube-prometheus-stack

# Grafana dashboards configuration
grafana:
  dashboards:
    enabled: true
    # Namespace where the dashboard ConfigMap will be created
    namespace: kube-mon
    # Labels to add to the ConfigMap
    # These labels are used by Grafana sidecar to discover dashboards
    labels:
      grafana_dashboard: "1"
    # Annotations to add to the ConfigMap
    annotations: {}

extraManifests: {}

