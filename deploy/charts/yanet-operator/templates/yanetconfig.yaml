{{- include "yanet-operator.validateRuntimeResources" . }}
{{- with .Values.yanetconfig }}
apiVersion: yanet.yanet-platform.io/v1alpha1
kind: YanetConfig
metadata:
  name: config
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
   {{- with .spec }}
     {{- toYaml . | nindent 2 }}
   {{- end }}
{{- end }}
