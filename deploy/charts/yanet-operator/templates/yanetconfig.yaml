{{- include "yanet-operator.validateRuntimeResources" . }}
{{- $argoCD := .Values.runtimeResources.argoCD }}
{{- with .Values.yanetconfig }}
apiVersion: yanet.yanet-platform.io/v1alpha1
kind: YanetConfig
metadata:
  name: config
  {{- if $argoCD }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  {{- end }}
spec:
   {{- with .spec }}
     {{- toYaml . | nindent 2 }}
   {{- end }}
{{- end }}
