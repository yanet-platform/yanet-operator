{{- if and .Values.yanetconfig .Values.webhook.enabled (eq .Values.webhook.failurePolicy "Fail") }}
{{- fail "yanetconfig cannot be chart-managed while webhook.failurePolicy=Fail; use Ignore during Helm reconciliation or manage YanetConfig separately" }}
{{- end }}
{{- with .Values.yanetconfig }}
apiVersion: yanet.yanet-platform.io/v1alpha1
kind: YanetConfig
metadata:
  name: config
spec:
   {{- with .spec }}
     {{- toYaml . | nindent 2 }}
   {{- end }}
{{- end }}
