{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "yanet-operator.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "yanet-operator.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ include "yanet-operator.fullname" . }}-webhook-certs
  dnsNames:
  - {{ include "yanet-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
  issuerRef:
    name: {{ include "yanet-operator.fullname" . }}-selfsigned
    kind: Issuer
    group: cert-manager.io
{{- end }}
