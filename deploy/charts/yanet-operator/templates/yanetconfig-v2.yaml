{{- if and .Values.yanetconfigV2 .Values.webhook.enabled (eq .Values.webhook.failurePolicy "Fail") }}
{{- fail "yanetconfigV2 cannot be chart-managed while webhook.failurePolicy=Fail; use Ignore during Helm reconciliation or manage YanetConfigV2 separately" }}
{{- end }}
{{- with .Values.yanetconfigV2 }}
apiVersion: yanet.yanet-platform.io/v2alpha1
kind: YanetConfigV2
metadata:
  name: config
spec:
   {{- with .spec }}
     {{- toYaml . | nindent 2 }}
   {{- end }}
{{- end }}
