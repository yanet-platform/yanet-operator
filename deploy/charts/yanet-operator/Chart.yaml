apiVersion: v2
name: yanet-operator
description: A Helm chart for yanet-operator - Kubernetes operator for YANET deployments
type: application
# Native-sidecar named target ports are resolved by EndpointSlice starting in 1.33.
kubeVersion: ">=1.33.0-0"
# Chart and application versions share the release number from 3.0.2 onward.
version: 3.1.0
# Stable release CI synchronizes both fields with the released image version.
# It determines the Docker image tag: ghcr.io/yanet-platform/yanet-operator:<appVersion>
appVersion: "3.1.0"
dependencies:
  - name: cert-manager
    version: v1.21.3
    repository: oci://quay.io/jetstack/charts
    condition: cert-manager.enabled
maintainers:
  - name: yanet-platform
    url: https://github.com/yanet-platform
