# v2alpha1 YanetConfig — must be ACCEPTED.
# Trimmed version of deploy/examples/v2alpha1-yanetconfig-full.yaml: two patches,
# one boxType (release) referencing them, including both dataplane sidecars.
apiVersion: yanet.yanet-platform.io/v2alpha1
kind: YanetConfigV2
metadata:
  name: config
spec:
  stop: false
  updateWindow: 60
  hostNetworkPortRange: {start: 20000, end: 20100}
  images:
    registry: docker.io/test
  components:
    controlplane:
      image: {name: controlplane, tag: test}
    dataplane:
      image: {name: dataplane, tag: test}
      sidecars:
        bird:
          image: {name: bird, tag: test}
        netlinkDataplaneSidecar:
          image: {name: netlink-dataplane-sidecar, tag: test}
    birdAdapter:
      image: {name: bird-adapter, tag: test}
    announcer:
      image: {name: announcer, tag: test}
  patches:
    - name: telegraf
      patch:
        spec:
          template:
            metadata:
              annotations:
                telegraf.influxdata.com/ports: "8080"
    - name: checkpointer
      patch:
        spec:
          template:
            metadata:
              annotations:
                checkpointer.ydb.tech/checkpoint: "true"
  boxTypes:
    - name: release
      components:
        controlplane:
          patches: [telegraf, checkpointer]
        dataplane:
          sidecars:
            bird: {}
            netlinkDataplaneSidecar: {}
          patches: [telegraf, checkpointer]
        announcer:
          patches: [checkpointer]
