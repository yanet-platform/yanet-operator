# v1alpha1 Yanet — must be ACCEPTED. References the boxType "release" defined
# in 03-yanetconfig-valid.yaml. Per-component `enabled: false` makes the
# reconciler render Deployments with replicas=0, while `autoSync: true` keeps
# the reconcile loop active so we can verify the generated Deployments.
apiVersion: yanet.yanet-platform.io/v1alpha1
kind: Yanet
metadata:
  name: test-node.example.com
  namespace: yanet
spec:
  boxType: release
  autoSync: true
  nodeSelector:
    kubernetes.io/hostname: test-node-does-not-exist
  components:
    controlplane:
      enabled: false
    dataplane:
      enabled: false
      sidecars:
        bird:
          enabled: false
    operators:
      announcer:
        enabled: false
