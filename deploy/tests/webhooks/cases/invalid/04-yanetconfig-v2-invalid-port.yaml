# v2alpha1 YanetConfig - must be REJECTED by vyanetconfig-v2.kb.io.
# Reason: the dataplane port is outside the valid TCP port range.
apiVersion: yanet.yanet-platform.io/v2alpha1
kind: YanetConfigV2
metadata:
  name: config
spec:
  components:
    controlplane:
      image: {name: controlplane, tag: test}
      port: 8080
    dataplane:
      image: {name: dataplane, tag: test}
      port: 70000
  boxTypes:
    - name: release
      components:
        controlplane: {}
        dataplane: {}
