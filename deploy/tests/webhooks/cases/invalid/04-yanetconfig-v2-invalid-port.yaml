# v2alpha1 YanetConfig - must be REJECTED by vyanetconfig-v2.kb.io.
# Reason: the host-network listener range is reversed.
apiVersion: yanet.yanet-platform.io/v2alpha1
kind: YanetConfigV2
metadata:
  name: config
spec:
  hostNetworkPortRange: {start: 20100, end: 20000}
  components:
    controlplane:
      image: {name: controlplane, tag: test}
    dataplane:
      image: {name: dataplane, tag: test}
  boxTypes:
    - name: release
      components:
        controlplane: {}
        dataplane: {}
