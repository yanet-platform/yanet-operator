# v1alpha1 YanetConfig — must be ACCEPTED.
# Trimmed version of deploy/examples/v1alpha1-yanetconfig-full.yaml: two patches,
# one boxType (release) referencing them, including both dataplane sidecars.
apiVersion: yanet.yanet-platform.io/v1alpha1
kind: YanetConfig
metadata:
  name: config
spec:
  stop: false
  updateWindow: 60
  images:
    registry: docker.io/test
  components:
    controlplane:
      image: {name: controlplane, tag: test}
    dataplane:
      image: {name: dataplane, tag: test}
      sidecars:
        - name: bird
          image: {name: bird, tag: test}
          listeners: []
        - name: neighbour-sidecar
          image: {name: neighbour-sidecar, tag: test}
    birdAdapter:
      image: {name: bird-adapter, tag: test}
    operators:
      - name: announcer
        containers:
          - name: announcer
            image: {name: announcer, tag: test}
  patches:
    - name: telegraf
      patch:
        spec:
          template:
            metadata:
              annotations:
                telegraf.influxdata.com/ports: "8080"
    - name: checkpointer
      patch:
        spec:
          template:
            metadata:
              annotations:
                checkpointer.ydb.tech/checkpoint: "true"
  boxTypes:
    - name: release
      components:
        controlplane:
          patches: [telegraf, checkpointer]
        dataplane:
          sidecars:
            bird: {}
            neighbour-sidecar: {}
          patches: [telegraf, checkpointer]
      operators:
        announcer:
          patches: [checkpointer]
