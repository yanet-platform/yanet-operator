apiVersion: yanet.yanet-platform.io/v1alpha1
kind: YanetConfig
metadata:
  labels:
    app.kubernetes.io/name: yanet-operator
    app.kubernetes.io/managed-by: kustomize
  name: config
spec:
  # Global per-cluster throttling between any two node restarts (seconds).
  updateWindow: 60

  # Global image settings shared by every generated Deployment:
  # {registry}/{prefix}/{image}:{tag}.
  images:
    registry: cr.yandex/yanet
    prefix: yanet2
    pullPolicy: IfNotPresent

  # ============================================================
  # 1) COMPONENTS — palette of available components.
  #    The dataplane's privileged + hostIPC + minimal host
  #    devices, and the controlplane's hostIPC + /dev/hugepages shmem
  #    mount, are emitted by the BUILDER (see builder.go). They are
  #    intrinsic to how the components run and are NOT configured here.
  # ============================================================
  components:
    controlplane:
      image: {name: controlplane, tag: v2.1.0}
      numa: 1             # one controlplane Deployment per NUMA domain
      # disabledNuma: [1] # skip NUMA domains without a NIC
      config:
        hostPath: /etc/yanet2
        # The NUMA index is appended to the config file base name, so each
        # instance reads its own /etc/yanet2/controlplane-<numa>.yaml.
        args: [-c, /etc/yanet2/controlplane.yaml]

    dataplane:
      image: {name: dataplane, tag: v2.1.0}
      hugepages:
        size: 1Gi
        count: 8
      # Workloads use private Pod networking; hostNetwork and hostPort are not supported.
      config:
        hostPath: /etc/yanet2
        args: [/etc/yanet2/dataplane.yaml]
      sidecars:
        - name: bird
          image: {name: bird, tag: "2.15"}
          config:
            hostPath: /etc/bird
        - name: netlink-dataplane-sidecar
          image: {name: netlink-dataplane-sidecar, tag: v2.1.0}
          config:
            hostPath: /etc/yanet2
            args: [-c, /etc/yanet2/netlink-dataplane-sidecar.yaml]

  # ============================================================
  # 2) PATCHES — named registry of strategic-merge Deployment fragments.
  #    Only OPTIONAL tuning lives here (resources, tolerations, ...).
  # ============================================================
  patches:
    # The operator injects YANET_KUBERNETES_GRPC_PORT before patch env entries.
    # The standalone controlplane uses gRPC port 8080 in its Pod network namespace.
    - name: controlplane-listener
      patch:
        spec:
          template:
            spec:
              containers:
                - name: controlplane
                  env:
                    - name: YANET_GATEWAY_ENDPOINT
                      value: '[::]:$(YANET_KUBERNETES_GRPC_PORT)'

    - name: tolerations
      patch:
        spec:
          template:
            spec:
              tolerations:
                - effect: NoSchedule
                  key: CriticalAddonsOnly
                - effect: NoSchedule
                  operator: Exists
                - effect: NoExecute
                  operator: Exists

    - name: dp-resources
      patch:
        spec:
          template:
            spec:
              containers:
                - name: dataplane
                  resources:
                    limits: {memory: 32Gi}

  # ============================================================
  # 3) BOX TYPES — presets wiring components to patch lists.
  #    Each boxType MUST define controlplane and dataplane.
  #    A Yanet CR references one boxType by name (here: "release").
  # ============================================================
  boxTypes:
    - name: release
      components:
        controlplane:
          patches: [controlplane-listener, tolerations]
        dataplane:
          sidecars:
            bird: {}
            netlink-dataplane-sidecar: {}
          patches: [tolerations, dp-resources]
