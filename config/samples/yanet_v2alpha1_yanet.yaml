apiVersion: yanet.yanet-platform.io/v2alpha1
kind: YanetV2
metadata:
  labels:
    app.kubernetes.io/name: yanet-operator
    app.kubernetes.io/managed-by: kustomize
  name: yanet-sample
spec:
  # Selects a boxType from YanetConfigV2.spec.boxTypes[] (see
  # yanet_v2alpha1_yanetconfig.yaml). Required.
  boxType: release

  # Restrict the installation to a subset of nodes. Empty matches all.
  nodeSelector:
    kubernetes.io/hostname: node1.example.com

  # Scale-to-zero switch for the whole installation (default true).
  enabled: true

  # Automatic synchronization. When false, the reconciler only reports
  # drift via Status without touching generated Deployments (default false).
  autoSync: true

  # The ONLY per-installation overrides are enabled + per-container image.
  # Everything broader (resources, securityContext, hostIPC, ...) lives in
  # the YanetConfigV2 boxType/patches, or is emitted by the builder.
  components:
    controlplane:
      enabled: true
      containers:
        controlplane:
          name: yanet-controlplane-director
          tag: v2.1.0
    dataplane:
      enabled: true
      containers:
        dataplane:
          name: yanet-dataplane
          tag: v2.1.0
