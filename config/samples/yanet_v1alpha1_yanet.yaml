apiVersion: yanet.yanet-platform.io/v1alpha1
kind: Yanet
metadata:
  labels:
    app.kubernetes.io/name: yanet-operator
    app.kubernetes.io/managed-by: kustomize
  name: yanet-sample
spec:
  # Selects a boxType from YanetConfig.spec.boxTypes[] (see
  # yanet_v1alpha1_yanetconfig.yaml). Required.
  boxType: release

  # Restrict the installation by Node labels (empty matches all). The hostname
  # label is an example selector; it need not equal the Node's API name.
  nodeSelector:
    kubernetes.io/hostname: node1.example.com

  # Scale-to-zero switch for the whole installation (default true).
  enabled: true

  # Automatic synchronization. When false, the reconciler only reports
  # drift via Status without touching generated Deployments (default false).
  autoSync: true

  # Examples of per-installation overrides: enablement and per-container images.
  # Runtime endpoints and everything broader
  # (resources, securityContext, hostIPC, ...) live in YanetConfig patches or
  # are emitted by the builder.
  components:
    controlplane:
      enabled: true
      containers:
        controlplane:
          name: yanet-controlplane-director
          tag: v2.1.0
    dataplane:
      enabled: true
      containers:
        dataplane:
          name: yanet-dataplane
          tag: v2.1.0
