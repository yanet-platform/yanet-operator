apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yanet-operator-system
namePrefix: yanet-operator-

# Requires cert-manager, including its CA injector, installed in the cluster.
# Admission only: this single-version API does not use CRD conversion webhooks.
resources:
- ../crd
- ../rbac
- ../manager
- ../webhook
- ../certmanager

patches:
- path: manager_auth_proxy_patch.yaml
- path: manager_webhook_patch.yaml
- target:
    kind: ValidatingWebhookConfiguration
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        cert-manager.io/inject-ca-from: system/serving-cert

replacements:
- source:
    kind: Certificate
    name: serving-cert
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: /
      index: 0
- source:
    kind: Certificate
    name: serving-cert
    fieldPath: metadata.name
  targets:
  - select:
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: /
      index: 1
- source:
    kind: Service
    name: webhook-service
    fieldPath: metadata.name
  targets:
  - select:
      kind: Certificate
    fieldPaths:
    - spec.dnsNames.0
    options:
      delimiter: .
      index: 0
- source:
    kind: Service
    name: webhook-service
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: Certificate
    fieldPaths:
    - spec.dnsNames.0
    options:
      delimiter: .
      index: 1
