# Staticcheck, gosec, go vet and the full test suite with the race detector.
name: AI Code Review

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
      
      - name: Run static analysis
        id: static-analysis
        continue-on-error: true
        run: |
          # Install analysis tools
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          
          echo "## 🔍 Static Analysis Results" > review.md
          echo "" >> review.md
          status=0
          
          # Run staticcheck
          echo "### 📊 Staticcheck" >> review.md
          if staticcheck ./... 2>&1 | tee staticcheck.log; then
            echo "✅ No issues found" >> review.md
          else
            status=1
            echo '```' >> review.md
            cat staticcheck.log >> review.md
            echo '```' >> review.md
          fi
          echo "" >> review.md
          
          # Run gosec for security issues
          echo "### 🔒 Security Analysis (gosec)" >> review.md
          if gosec -fmt=text ./... 2>&1 | tee gosec.log; then
            echo "✅ No security issues found" >> review.md
          else
            status=1
            echo '```' >> review.md
            cat gosec.log >> review.md
            echo '```' >> review.md
          fi
          echo "" >> review.md
          
          # Run go vet
          echo "### 🔧 Go Vet" >> review.md
          if go vet ./... 2>&1 | tee govet.log; then
            echo "✅ No issues found" >> review.md
          else
            status=1
            echo '```' >> review.md
            cat govet.log >> review.md
            echo '```' >> review.md
          fi
          echo "" >> review.md
          exit "$status"
      
      - name: Race detector check
        id: race-check
        continue-on-error: true
        run: |
          echo "### 🏁 Race Detector" >> review.md
          # This target installs the pinned envtest control-plane assets in Docker.
          if make test-docker-race 2>&1 | tee race.log; then
            echo "✅ Full test suite passed with the race detector" >> review.md
          else
            echo '```' >> review.md
            cat race.log >> review.md
            echo '```' >> review.md
            exit 1
          fi
          echo "" >> review.md
      
      - name: Post review comment
        # Fork PR tokens cannot write comments; their reports remain in artifacts.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            let reviewContent = '';
            try {
              reviewContent = fs.readFileSync('review.md', 'utf8');
            } catch (error) {
              reviewContent = 'Could not generate review content';
            }
            
            const header = '## 🤖 AI Code Review\n\n' +
              'This workflow runs:\n' +
              '- Staticcheck\n' +
              '- gosec\n' +
              '- go vet\n' +
              '- The full test suite with the Go race detector and envtest\n\n';
            
            const footer = '\n\n---\n' +
              '*Passing checks do not prove the absence of races or deadlocks, ' +
              'or correctness of context and goroutine lifecycles.*';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: header + reviewContent + footer
            });
      
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-results
          path: |
            review.md
            *.log
          retention-days: 30
      
      - name: Summary
        if: always()
        run: |
          echo "### AI Code Review Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f review.md ]; then
            cat review.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Enforce analysis results
        if: always()
        env:
          STATIC_OUTCOME: ${{ steps.static-analysis.outcome }}
          RACE_OUTCOME: ${{ steps.race-check.outcome }}
        run: |
          if [[ "$STATIC_OUTCOME" == failure || "$RACE_OUTCOME" == failure ]]; then
            echo "Static analysis or race tests failed; see the review artifacts."
            exit 1
          fi
